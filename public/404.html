<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PWNPipe</title>
    <script>
      // SPA redirect for GitHub Pages (user pages — pathSegmentsToKeep: 0)
      // Encodes the full path into a query string so index.html is served,
      // then the inline script in index.html restores the real URL before React boots.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
